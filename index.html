<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivora - Smart Health Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vivora-unified-theme.css">
<style>
.welcome-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(135deg,#FDEBE9 0%,#FFF8F7 52%,#F6C9C7 100%);font-family:Poppins,Roboto,Arial,sans-serif;color:#5A3035}
.welcome-brand{text-align:center;margin-bottom:28px}.welcome-icon{width:72px;height:72px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#F6C9C7;color:#A94F59;border-radius:18px;font-size:34px}.welcome-brand h1{margin:0;color:#5A3035;font-size:40px}.welcome-brand p{margin:5px 0 0;color:#85666A;font-size:15px}.welcome-card{width:min(650px,100%);background:#fff;border:1px solid #F0C9C7;border-radius:18px;box-shadow:0 10px 28px rgba(169,79,89,.10);padding:38px;text-align:center}.welcome-card h2{margin:0 0 10px;color:#5A3035;font-size:29px}.welcome-card p{margin:0 auto 26px;max-width:540px;color:#85666A;font-size:16px;line-height:1.7}.start-button{border:0;background:#C96F78;color:#fff;padding:13px 26px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}.start-button:hover{background:#A94F59}footer{margin-top:22px}footer p{margin:0;color:#85666A;font-size:14px}@media(max-width:600px){.welcome-page{padding:25px 16px}.welcome-card{padding:30px 22px}.welcome-brand h1{font-size:34px}.welcome-card h2{font-size:25px}.start-button{width:100%}}
</style>
</head>
<body>
<main class="welcome-page">
<div class="welcome-brand"><div class="welcome-icon">♥</div><h1>Vivora</h1><p>Smart Health Companion</p></div>
<section class="welcome-card"><h2>Care that stays with you.</h2><p>Vivora helps you manage medicines, appointments, health records and everyday care with ease.</p><button class="start-button">Get Started <span>→</span></button></section>
<footer><p>Designed with care for senior citizens ❤️</p></footer>
</main>
<script>document.querySelector('.start-button').addEventListener('click',()=>window.location.href='login.html');</script>
</body>
</html>
