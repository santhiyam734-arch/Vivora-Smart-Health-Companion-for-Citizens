<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vivora - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vivora-unified-theme.css">
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 18px;background:linear-gradient(135deg,#FDEBE9 0%,#FFF8F7 52%,#F6C9C7 100%);font-family:Poppins,Roboto,Arial,sans-serif;color:#5A3035}.login-card{width:min(470px,100%);background:#fff;border:1px solid #F0C9C7;border-radius:18px;box-shadow:0 10px 28px rgba(169,79,89,.10);padding:34px}.login-brand{text-align:center;margin-bottom:24px}.login-brand .icon{width:62px;height:62px;margin:0 auto 11px;display:flex;align-items:center;justify-content:center;background:#F6C9C7;color:#A94F59;border-radius:16px;font-size:30px}.login-brand h1{margin:0;color:#5A3035;font-size:32px}.login-brand p{margin:5px 0;color:#85666A;font-size:14px}.auth-section{padding-top:20px;border-top:1px solid #F0C9C7}.auth-section+.auth-section{margin-top:22px}.auth-section h2{font-size:20px;color:#5A3035;margin:0 0 14px}.auth-section form{display:flex;flex-direction:column;gap:10px}.auth-section input{width:100%;padding:12px 13px;border:1px solid #F0C9C7;border-radius:10px;background:#fff;color:#5A3035;box-sizing:border-box}.auth-section input:focus{outline:none;border-color:#C96F78;box-shadow:0 0 0 3px rgba(201,111,120,.12)}.auth-section button{padding:12px 16px;border:0;background:#C96F78;color:#fff;border-radius:10px;font-family:inherit;font-weight:600;cursor:pointer}.auth-section button:hover{background:#A94F59}.message{min-height:20px;margin:8px 0 0;font-size:13px;color:#A94F59}
</style>
</head>
<body><main class="login-page"><section class="login-card"><div class="login-brand"><div class="icon">♥</div><h1>Vivora</h1><p>Smart Health Companion</p></div>
<div class="auth-section"><h2>Login</h2><form id="loginForm"><input type="email" id="loginEmail" placeholder="Email" required><input type="password" id="loginPassword" placeholder="Password" required><button type="submit">Login</button></form><p id="loginMessage" class="message"></p></div>
<div class="auth-section"><h2>Create Account</h2><form id="signupForm"><input type="email" id="signupEmail" placeholder="Email" required><input type="password" id="signupPassword" placeholder="Password" required><button type="submit">Sign Up</button></form><p id="signupMessage" class="message"></p></div>
</section></main><script type="module" src="js/auth.js"></script></body></html>
